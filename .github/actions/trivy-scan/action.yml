name: Validate Docker image with Trivy
description: Scan OS and application dependencies and enforce the CVSS policy (SCANDOCKER-91).
inputs:
  image-ref:
    description: Docker image to scan; the caller must authenticate to its registry.
    required: true
runs:
  using: composite
  steps:
    - name: Scan Docker image
      id: scan
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        image-ref: ${{ inputs.image-ref }}
        format: json
        output: trivy-results.json
        trivy-config: .github/trivy.yaml
        trivyignores: .trivyignore.yaml
        scanners: vuln,secret
        vuln-type: os,library
        exit-code: '0' # The CVSS evaluator below decides whether findings fail the job.

    - name: Generate HTML report
      if: ${{ !cancelled() && steps.scan.outcome == 'success' }}
      shell: bash
      run: |
        set -euo pipefail
        # Official Trivy v0.70.0 template, pinned to the release commit.
        curl --fail --silent --show-error --location --retry 3 \
          https://raw.githubusercontent.com/aquasecurity/trivy/8a3177aedf7ee0864920eb1852eef031cd3742b8/contrib/html.tpl \
          --output "$RUNNER_TEMP/trivy-html.tpl"
        trivy convert --format template --template "@$RUNNER_TEMP/trivy-html.tpl" \
          --output trivy-results.html trivy-results.json

    - name: Generate SARIF report
      if: ${{ !cancelled() && steps.scan.outcome == 'success' }}
      shell: bash
      run: trivy convert --format sarif --output trivy-results.sarif trivy-results.json

    - name: Evaluate Trivy report against CVSS policy
      if: ${{ !cancelled() && steps.scan.outcome == 'success' }}
      shell: bash
      run: python3 .github/workflows/scripts/evaluate-trivy-report.py --summary "$GITHUB_STEP_SUMMARY" trivy-results.json

    - name: Upload Trivy reports
      id: reports
      if: ${{ always() }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: trivy-results
        path: |
          trivy-results.json
          trivy-results.sarif
          trivy-results.html

    - name: Link reports in job summary
      if: ${{ always() && steps.reports.outputs.artifact-url != '' }}
      shell: bash
      env:
        REPORT_URL: ${{ steps.reports.outputs.artifact-url }}
      run: |
        printf 'Download [Trivy reports](%s) and open **trivy-results.html** for vulnerability tables. JSON and SARIF, including secret findings, are included in the same artifact.\n' \
          "$REPORT_URL" >> "$GITHUB_STEP_SUMMARY"

    - name: Upload Trivy results to GitHub Security
      if: ${{ always() && hashFiles('trivy-results.sarif') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
      uses: github/codeql-action/upload-sarif@5e7a52feb2a3dfb87f88be2af33b9e2275f48de6 # v4.32.4
      with:
        sarif_file: trivy-results.sarif
        category: sonar-scanner-cli-image
