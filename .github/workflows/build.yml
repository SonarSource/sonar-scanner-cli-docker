name: Build
on:
  push:
    branches:
      - master
      - 'branch-*'
  pull_request:
  merge_group:
  workflow_dispatch:
    inputs:
      image-ref:
        description: 'Existing image to validate; leave empty to build and validate this branch'
        required: false
        type: string

env:
  DOCKER_REPOX_BUILDS_REGISTRY: repox-sonarsource-docker-builds.jfrog.io
  DOCKER_IMAGE: "sonarsource/sonar-scanner-cli"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: write

jobs:
  build:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.image-ref == '' }}
    name: Build Docker image
    runs-on: github-ubuntu-latest-s
    timeout-minutes: 30
    outputs:
      docker-image: ${{ steps.docker-image-setup.outputs.docker-image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: 'true'

      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          version: 2026.10.15

      - uses: SonarSource/ci-github-actions/get-build-number@v2

      - name: Vault
        id: secrets
        uses: SonarSource/vault-action-wrapper@a7fa5fd4a4e4e0f2593f6137c0812cac196cf4ce  # 3.7.0
        with:
          secrets: |
            development/artifactory/token/{REPO_OWNER_NAME_DASH}-docker-release access_token | ARTIFACTORY_DEPLOY_PASSWORD;
            development/artifactory/token/{REPO_OWNER_NAME_DASH}-docker-release username | ARTIFACTORY_DEPLOY_USERNAME;

      - name: Docker login to Repox registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ${{ env.DOCKER_REPOX_BUILDS_REGISTRY }}
          username: ${{ fromJSON(steps.secrets.outputs.vault).ARTIFACTORY_DEPLOY_USERNAME }}
          password: ${{ fromJSON(steps.secrets.outputs.vault).ARTIFACTORY_DEPLOY_PASSWORD }}

      - name: Setup Docker image
        shell: bash
        id: docker-image-setup
        run: |
          DOCKER_IMAGE_BUILD_NUMBER="${DOCKER_REPOX_BUILDS_REGISTRY}/${DOCKER_IMAGE}:${BUILD_NUMBER}"
          echo "docker-image=${DOCKER_IMAGE_BUILD_NUMBER}" >> $GITHUB_OUTPUT

      - name: Build Docker image
        shell: bash
        env:
          DOCKER_IMAGE_BUILD_NUMBER: ${{ steps.docker-image-setup.outputs.docker-image }}
        run: |
          docker build --tag "${DOCKER_IMAGE_BUILD_NUMBER}" --push .

  test:
    needs:
      - build
    name: Test Docker image
    runs-on: github-ubuntu-latest-s
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: 'true'

      - name: Vault
        id: secrets
        uses: SonarSource/vault-action-wrapper@a7fa5fd4a4e4e0f2593f6137c0812cac196cf4ce  # 3.7.0
        with:
          secrets: |
            development/artifactory/token/{REPO_OWNER_NAME_DASH}-docker-release access_token | ARTIFACTORY_DEPLOY_PASSWORD;
            development/artifactory/token/{REPO_OWNER_NAME_DASH}-docker-release username | ARTIFACTORY_DEPLOY_USERNAME;

      - name: Docker login to Repox registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ${{ env.DOCKER_REPOX_BUILDS_REGISTRY }}
          username: ${{ fromJSON(steps.secrets.outputs.vault).ARTIFACTORY_DEPLOY_USERNAME }}
          password: ${{ fromJSON(steps.secrets.outputs.vault).ARTIFACTORY_DEPLOY_PASSWORD }}

      - name: Verify pushed image exists
        shell: bash
        env:
          DOCKER_IMAGE_BUILD_NUMBER: ${{ needs.build.outputs.docker-image }}
        run: |
          docker manifest inspect "${DOCKER_IMAGE_BUILD_NUMBER}" >/dev/null \
            || { echo "Image not found: ${DOCKER_IMAGE_BUILD_NUMBER}"; exit 1; }

      - name: Test Docker image
        shell: bash
        env:
          DOCKER_IMAGE_BUILD_NUMBER: ${{ needs.build.outputs.docker-image }}
        run: |
          apt-get update && apt-get install -qy curl jq
          echo "Checking out the sonar-scanning-examples repository"
          git clone https://github.com/SonarSource/sonar-scanning-examples.git target_repository
          echo "Test the ${DOCKER_IMAGE_BUILD_NUMBER} image"
          TEST_IMAGE="${DOCKER_IMAGE_BUILD_NUMBER}" ./test/bats/bin/bats --tap test

  trivy-scan:
    needs:
      - build
    if: ${{ !cancelled() && (needs.build.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.image-ref != '')) }}
    name: Validate Docker image with Trivy
    runs-on: github-ubuntu-latest-s
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
      security-events: write
    env:
      IMAGE_REF: ${{ inputs.image-ref || needs.build.outputs.docker-image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Vault
        if: ${{ startsWith(env.IMAGE_REF, 'repox-sonarsource-docker-builds.jfrog.io/') }}
        id: secrets
        uses: SonarSource/vault-action-wrapper@a7fa5fd4a4e4e0f2593f6137c0812cac196cf4ce # 3.7.0
        with:
          secrets: |
            development/artifactory/token/{REPO_OWNER_NAME_DASH}-docker-release access_token | ARTIFACTORY_DEPLOY_PASSWORD;
            development/artifactory/token/{REPO_OWNER_NAME_DASH}-docker-release username | ARTIFACTORY_DEPLOY_USERNAME;
      - name: Docker login to Repox registry
        if: ${{ startsWith(env.IMAGE_REF, 'repox-sonarsource-docker-builds.jfrog.io/') }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.DOCKER_REPOX_BUILDS_REGISTRY }}
          username: ${{ fromJSON(steps.secrets.outputs.vault).ARTIFACTORY_DEPLOY_USERNAME }}
          password: ${{ fromJSON(steps.secrets.outputs.vault).ARTIFACTORY_DEPLOY_PASSWORD }}
      - name: Validate selected image
        uses: ./.github/actions/trivy-scan
        with:
          image-ref: ${{ env.IMAGE_REF }}
          advisory: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}

  scan:
    needs:
      - build
    runs-on: github-ubuntu-latest-s
    name: SonarQube Server scan
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: 'true'
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          cache_save: false
          version: 2026.10.15
      - name: Vault
        id: secrets
        uses: SonarSource/vault-action-wrapper@a7fa5fd4a4e4e0f2593f6137c0812cac196cf4ce  # 3.7.0
        with:
          secrets: |
            development/kv/data/next url | NEXT_URL;
            development/kv/data/next token | NEXT_TOKEN;
      - name: Test Trivy policy and generate coverage
        run: |
          python3 -m venv "$RUNNER_TEMP/trivy-policy-tests"
          "$RUNNER_TEMP/trivy-policy-tests/bin/python" -m pip install --disable-pip-version-check coverage==7.16.2
          "$RUNNER_TEMP/trivy-policy-tests/bin/python" -m coverage run -m unittest discover -s test/trivy -v
          "$RUNNER_TEMP/trivy-policy-tests/bin/python" -m coverage report
          "$RUNNER_TEMP/trivy-policy-tests/bin/python" -m coverage xml
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ fromJSON(steps.secrets.outputs.vault).NEXT_TOKEN }}
          SONAR_HOST_URL: ${{ fromJSON(steps.secrets.outputs.vault).NEXT_URL }}
